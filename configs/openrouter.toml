# OpenRouter: one key for many providers. Reads OPENROUTER_API_KEY.
# Use an OpenRouter model ID, such as "anthropic/claude-sonnet-5" or "qwen/qwen3-coder".
[llm]
provider = "openrouter"
model = "qwen/qwen3-coder"
timeout_seconds = 180.0
max_retries = 4

[campaign]
max_rounds = 20
max_tool_calls = 100
seed = 0

[execution]
timeout_seconds = 20.0
memory_mb = 1024
cpu_seconds = 15
max_output_bytes = 1000000

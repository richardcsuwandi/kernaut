name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip install -e examples/extension
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: kernaut task-run --task sine --config examples/extension/offline.toml --baseline linear-demo --archive runs/ci/archive.sqlite
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine cffconvert
      - run: cffconvert --validate
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl
      - run: kernaut verify examples/candidates/dual_warp_fold.json
